name: ScraperAPI Diagnose
on: workflow_dispatch
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Check account response
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests
          from urllib.parse import quote
          key = os.environ.get("SCRAPER_API_KEY", "").strip()
          if not key:
              raise SystemExit("SCRAPER_API_KEY is missing")
          try:
              r = requests.get("https://api.scraperapi.com/account",
                               params={"api_key": key}, timeout=(10, 30),
                               allow_redirects=False)
          except requests.RequestException as e:
              raise SystemExit(f"Network error: {type(e).__name__}") from None
          print("HTTP:", r.status_code)
          print("Content-Type:", r.headers.get("Content-Type"))
          safe = r.text.replace(key, "[REDACTED]").replace(quote(key, safe=""), "[REDACTED]")
          print("Body:", repr(safe[:400]))
          PY
